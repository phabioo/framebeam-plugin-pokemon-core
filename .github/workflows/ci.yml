name: CI
on:
  push:
  pull_request:
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: lua5.4 tools/bundle.lua --check
      - run: lua5.4 tests/run.lua
      - run: python3 -I -m unittest discover -s tests/tools
      - run: python3 -I tools/package.py --out dist
